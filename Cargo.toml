[workspace]
resolver = "3"
members = ["crates/cf_scene", "apps/studio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy kompiliert in Debug sonst extrem langsam zur Laufzeit.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
